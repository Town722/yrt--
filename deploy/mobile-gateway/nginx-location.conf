# Merge these locations into the existing HTTPS server block for your website.
# Keep the existing server_name, certificates, and other site locations.
location = /yrt-mobile/api/v1/video/h264/push {
    proxy_pass http://127.0.0.1:8765/api/v1/video/h264/push;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    client_body_timeout 8s;
    proxy_send_timeout 8s;
    proxy_read_timeout 30m;
}

location ^~ /yrt-mobile/api/ {
    proxy_pass http://127.0.0.1:8765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    client_body_timeout 180s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    client_max_body_size 32m;
}

location ^~ /yrt-mobile/ {
    alias /var/www/yrt-mobile/;
    index index.html;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
}
